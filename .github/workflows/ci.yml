name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    name: Build and test

    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3333
      APP_KEY: interval-local-ci-key-not-for-production
      COOKIE_DOMAIN: localhost
      POSTGRES_URL: postgres://interval:interval@127.0.0.1:5432/interval
      REDIS_URL: redis://127.0.0.1:6379
      POSTHOG_HOST: http://localhost:3333
      POSTHOG_KEY: phc_interval_ci
      SENTRY_DSN_API: http://ci@127.0.0.1:1/1

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          cache: true
      - name: Start database services
        run: docker compose up --detach --wait
      - name: Cache Turbo and Next.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ github.workspace }}/.turbo/cache
            ${{ github.workspace }}/apps/web/.next/cache
          key: ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Lint, format, build, type check, and test
        run: pnpm test
      - name: Build Cloudflare Worker
        run: pnpm --filter @interval.so/web run build:worker
      - name: Smoke-test production API
        run: |
          pnpm install --prod --filter @interval.so/api --frozen-lockfile

          HOST=127.0.0.1 PORT=3333 NODE_ENV=production node apps/api/build/bin/server.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          curl --fail --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 30 http://127.0.0.1:3333/health
