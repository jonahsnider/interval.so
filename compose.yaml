services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: interval
      POSTGRES_PASSWORD: interval
      POSTGRES_USER: interval
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U interval -d interval']
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
  redis-data:
