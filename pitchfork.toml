#:schema https://pitchfork.jdx.dev/schema.json

[daemons.postgres]
run = "docker compose up postgres"
auto = ["start", "stop"]
ready_output = "database system is ready to accept connections"
port = 5432

[daemons.redis]
run = "docker compose up redis"
auto = ["start", "stop"]
ready_output = "Ready to accept connections"
port = 6379
